name: finalize-v1.4-metadata

on:
  push:
    branches:
      - release/v1.4.0-rc
    paths:
      - '.github/workflows/finalize-v1.4-metadata.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote package metadata to 1.4.0
        shell: python
        run: |
          from pathlib import Path
          import re

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          old = 'version = "1.3.0"'
          if old not in text:
              raise SystemExit('Cargo.toml expected 1.3.0 package version not found')
          text = text.replace(old, 'version = "1.4.0"', 1)
          cargo.write_text(text, encoding='utf-8')

          lock = Path('Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          pat = r'(\[\[package\]\]\s*\nname = "yekaterina"\s*\nversion = ")1\.3\.0(")'
          text2, n = re.subn(pat, r'\g<1>1.4.0\2', text, count=1)
          if n != 1:
              raise SystemExit(f'Cargo.lock yekaterina version replacement count: {n}')
          lock.write_text(text2, encoding='utf-8')

          audit = Path('scripts/static_audit_v14.py')
          text = audit.read_text(encoding='utf-8')
          if 'EXPECTED_DEV_PACKAGE_VERSION = "1.3.0"' not in text:
              raise SystemExit('static audit expected dev version constant not found')
          text = text.replace('EXPECTED_DEV_PACKAGE_VERSION = "1.3.0"', 'EXPECTED_DEV_PACKAGE_VERSION = "1.4.0"', 1)
          text = text.replace('Early v1.4 development intentionally retains 1.3.0 package metadata so\n    # the release version is not promoted before the feature line is accepted.', 'Final v1.4 release metadata is pinned to 1.4.0 for the free baseline.')
          text = text.replace('v1.4 dev branch unexpectedly changed Cargo.toml release metadata', 'v1.4 release Cargo.toml metadata is not 1.4.0')
          text = text.replace('v1.4 dev branch keeps package metadata at 1.3.0 until promotion', 'v1.4 release package metadata is pinned to 1.4.0')
          text = text.replace('v1.4 dev branch unexpectedly changed Cargo.lock release metadata', 'v1.4 release Cargo.lock metadata is not 1.4.0')
          text = text.replace('Cargo.lock remains synchronized with the dev package metadata', 'Cargo.lock is synchronized with v1.4.0 package metadata')
          audit.write_text(text, encoding='utf-8')

      - name: Remove one-shot finalizer
        run: git rm .github/workflows/finalize-v1.4-metadata.yml

      - name: Commit final v1.4 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock scripts/static_audit_v14.py
          git commit -m "release: promote v1.4.0 package metadata"
          git push origin HEAD:release/v1.4.0-rc
