name: promote-v1.2.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout stable distribution repository
        uses: actions/checkout@v4
        with:
          path: stable

      - name: Checkout verified v1.2.0 RC source
        uses: actions/checkout@v4
        with:
          repository: stickleetoto/Yekaterina-Dev
          ref: 9019194af02f7b9cbe72c5a232e753e236a84b4f
          path: devsrc

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build locked Windows release binary
        shell: pwsh
        run: cargo build --locked --release --manifest-path devsrc/Cargo.toml

      - name: Run RC MCP showcase demo on Windows binary
        shell: cmd
        run: devsrc\DEMO_WINDOWS.bat devsrc\target\release\yekaterina.exe

      - name: Run stable distribution smoke test
        shell: cmd
        working-directory: stable
        run: SMOKE_TEST_WINDOWS.bat ..\devsrc\target\release\yekaterina.exe

      - name: Build stable distribution archive
        shell: pwsh
        working-directory: stable
        run: >-
          .\tools\MAKE_WINDOWS_RELEASE.ps1
          -ExePath ..\devsrc\target\release\yekaterina.exe
          -CargoProjectPath ..\devsrc
          -Version 1.2.0
          -OutDir .\release_build

      - name: Verify published archive checksum locally
        shell: pwsh
        working-directory: stable
        run: |
          $zip = '.\release_build\Yekaterina_v1.2.0_windows-x64.zip'
          $sum = "$zip.sha256.txt"
          if (!(Test-Path $zip)) { throw "Release ZIP missing: $zip" }
          if (!(Test-Path $sum)) { throw "Release checksum missing: $sum" }
          $expected = ((Get-Content $sum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "ZIP checksum mismatch: expected $expected actual $actual" }
          Write-Host "PASS: archive SHA-256 verified: $actual"

      - name: Preserve release package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yekaterina-v1.2.0-windows-x64
          path: |
            stable/release_build/Yekaterina_v1.2.0_windows-x64.zip
            stable/release_build/Yekaterina_v1.2.0_windows-x64.zip.sha256.txt

      - name: Publish v1.2.0 GitHub Release
        shell: pwsh
        working-directory: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.2.0 release already exists; refusing to overwrite it' }
          gh release create v1.2.0 `
            .\release_build\Yekaterina_v1.2.0_windows-x64.zip `
            .\release_build\Yekaterina_v1.2.0_windows-x64.zip.sha256.txt `
            --repo stickleetoto/Yekaterina `
            --target $env:GITHUB_SHA `
            --title 'Yekaterina v1.2.0' `
            --notes-file .\releases\v1.2.0\RELEASE_NOTES.md
